name: Bug
description: Something is broken, or the game refuses an action without saying why
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: seed
    attributes:
      label: Seed and month
      description: >-
        The seed is in the status bar along the bottom of the window, next to the autosave
        indicator. It makes the run reproducible, which is usually the difference between a fix
        and a guess.
      placeholder: Seed 9001, month 34
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Applications
        - The monthly loop
        - Papers and venues
        - Advisor and LabChat
        - Life and money
        - Conference trip
        - Job search
        - Endings and epilogue
        - Somewhere else
  - type: input
    id: env
    attributes:
      label: Browser and language
      description: Which browser, which version, and which of the two languages you were playing in.
      placeholder: Chrome 141 on macOS, English
    validations:
      required: true
