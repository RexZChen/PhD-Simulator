name: Balance
description: Something is too easy, too punishing, or happens too often
title: "[Balance] "
labels:
  - balance
body:
  - type: textarea
    id: what
    attributes:
      label: What feels wrong
      description: >-
        Which stat, event or outcome, and roughly when in the run. Include the seed from the
        status bar if you have it.
    validations:
      required: true
  - type: textarea
    id: harness
    attributes:
      label: npm run balance output
      description: Paste it if you can. Numbers beat impressions, and impressions are still useful.
      render: text
