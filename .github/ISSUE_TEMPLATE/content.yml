name: Content
description: The game got something wrong about a PhD, or left something out
title: "[Content] "
labels:
  - content
body:
  - type: textarea
    id: what
    attributes:
      label: What the game does now
      description: >-
        Quote it if you can, or say it does not happen at all. "The advisor says X when Y" is
        perfect.
    validations:
      required: true
  - type: textarea
    id: real
    attributes:
      label: What it is actually like
      description: >-
        The useful part. Specific beats general — a month, a number, a sentence someone said.
        No real names, please: every person, school and venue in this game stays fictional.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Your vantage point
      description: Optional, and helps weigh it.
      placeholder: US CS PhD, finished 2021
